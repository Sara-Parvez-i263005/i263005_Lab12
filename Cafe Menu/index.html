<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Warm Roast Café - Menu</title>
</head>
<body>

    <header>
        <h1>Warm Roast Café</h1>
        <nav>
            <a href="index.html">Menu</a>
            <a href="about.html">Our Story</a>
            <a href="contact.html">Visit Us</a>
        </nav>
    </header>

    <div class="container">
        <h2>Handcrafted Brews & Coffee</h2>
        
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=1000&auto=format&fit=crop" 
             alt="Cozy Coffee Cup" 
             class="hero-image">

        <table>
            <tr>
                <th>Type of Coffee</th>
                <th>Price ($)</th>
            </tr>
            <tr>
                <td>Americano</td>
                <td>3.00</td>
            </tr>
            <tr>
                <td>Cappuccino</td>
                <td>3.20</td>
            </tr>
            <tr>
                <td>Coffee Latte</td>
                <td>4.20</td>
            </tr>
            <tr>
                <td>Choco Latte</td>
                <td>5.00</td>
            </tr>
            <tr>
                <td>Mocha Latte</td>
                <td>4.50</td>
            </tr>
        </table>

        <div class="btn-container">
            <button type="button" onclick="confirmOrder()">Confirm your Order!</button>
        </div>
    </div>

    <footer>
        <p>&copy; Warm Roast Café. Crafted with warmth & cocoa.</p>
    </footer>

    <script>
        function confirmOrder() {
            console.log("Order button was clicked by the user.");
            window.alert("Your warm cup of coffee has been confirmed! We are preparing it with care.");
        }
    </script>
</body>
</html>
